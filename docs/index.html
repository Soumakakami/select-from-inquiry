    for (const r of L.stage) if (r.result === 'CLEAR') { addEv(r.user_id, 'STAGE_CLEAR', r._t, 1); if (stageById[r.stage_id][3] === 'RAID') addEv(r.user_id, 'RAID_CLEAR', r._t, 1); }
    for (const r of L.gacha) addEv(r.user_id, 'GACHA_DRAW', r._t, 1);
    for (const r of L.equip) if (r.action === 'ENHANCE_SUCCESS') addEv(r.user_id, 'ENHANCE_SUCCESS', r._t, 1);
    for (const r of L.cur) if (r.reason === 'GUILD_DONATE') addEv(r.user_id, 'GUILD_DONATE', r._t, -r.amount);
    for (const c of chars) addEv(c.user.id, 'CHARACTER_CREATE', c.createdT, 1);
    const evById = Object.fromEntries(EVENTS.map((e) => [e[0], e]));
    const periodOf = (m, u) => {
      if (m[2] === 'DAILY') return [TJ('2026-11-13 00:00:00'), T1];
      if (m[2] === 'WEEKLY') return [TJ('2026-11-09 00:00:00'), T1];
      if (m[2] === 'EVENT') { const e = evById[m[3]]; return [TJ(e[4]), Math.min(TJ(e[5]), T1)]; }
      if (m[2] === 'BEGINNER') return u.createdT >= TJ('2026-11-01 00:00:00') ? [u.createdT, T1] : null;
      return null;
    };
    const UM = [];
    for (const u of users) {
      for (const m of MISSIONS) {
        const p = periodOf(m, u); if (!p) continue;
        const evs = ((evOf.get(u.id) || {})[m[4]] || []).filter(([t]) => t >= p[0] && t <= p[1]).sort((a, b) => a[0] - b[0]);
        if (!evs.length) continue;
        let sum = 0, cleared = null;
        for (const [t, v] of evs) { sum += v; if (cleared == null && sum >= m[5]) cleared = t; }
        let recv = cleared != null && chance2(0.85) ? cleared + int2(5, 300) : null;
        if (recv != null && recv >= T1) recv = null;
        UM.push({ user_id: u.id, mission_id: m[0], progress: Math.min(sum, m[5]), cleared, recv, updated: Math.max(evs[evs.length - 1][0], recv || 0) });
        if (recv == null) continue;
        if (m[6] === 'GEM') cur(u, recv, 'GEM', m[8], 'MISSION', `mission:${m[0]}`);
        else { const c = liveChar2(u, recv); push('item', recv, { user_id: u.id, character_id: c ? c.id : null, item_id: m[7], item_uid: null, action: 'GET', quantity: m[8], target_user_id: null, detail: JSON.stringify({ source: 'ミッション報酬', mission_id: m[0] }) }); }
      }
    }

    // --- 今持っている装備（usr_equips）：期間前の手持ちに、log_equip を時系列で当てはめて組み立てる
    const owned = new Map();
    for (const [u, arr] of invInitial) {
      const c = u.chars.find((x) => !x.deletedT) || u.chars[0];
      for (const e of arr) owned.set(e.uid, { uid: e.uid, user_id: u.id, character_id: c ? c.id : null, equip_id: e.item, level: e.lvl, in_storage: 0, _t: int2(Math.max(u.createdT, T0 - DAY * 200), T0 - 3600) });
    }
    for (const r of [...L.equip].sort((a, b) => a._t - b._t || a._s - b._s)) {
      const d = r.detail ? JSON.parse(r.detail) : {};
      const o = owned.get(r.item_uid);
      if (r.action === 'GET') owned.set(r.item_uid, { uid: r.item_uid, user_id: r.user_id, character_id: r.character_id, equip_id: r.item_id, level: 0, in_storage: 0, _t: r._t });
      else if (!o) continue;
      else if (r.action === 'ENHANCE_SUCCESS') o.level = d.to;
      else if (r.action === 'ENHANCE_DESTROY' || r.action === 'SELL') owned.delete(r.item_uid);
      else if (r.action === 'STORAGE_IN') o.in_storage = 1;
      else if (r.action === 'STORAGE_OUT') o.in_storage = 0;
      else if (r.action === 'TRADE_IN') { o.user_id = r.user_id; o.character_id = r.character_id; o.in_storage = 0; }
    }

    // ================= finalize =================
    const order = (a, b) => a._t - b._t || a._s - b._s;
    for (const k of Object.keys(L)) {
      L[k].sort(order);
      L[k].forEach((r, i) => { r.id = i + 1; if (r._key) KEY[r._key] = r.id; });
    }
    // balances
    const bal = new Map();
    for (const r of L.cur) {
      const k = r.user_id + ':' + r.currency;
      if (!bal.has(k)) bal.set(k, []);
      bal.get(k).push(r);
    }
    const userById = new Map(users.map((u) => [u.id, u]));
    for (const [k, rows] of bal) {
      const u = userById.get(+k.split(':')[0]);
      const isGold = k.endsWith('GOLD');
      let s = 0, min = 0;
      for (const r of rows) { s += r.amount; min = Math.min(min, s); }
      let b = isGold ? (u.gold0 != null ? u.gold0 : int(2, 300) * 10000) : int(0, 4000);
      if (b + min < 0) b = -min + (isGold ? int(1, 20) * 1000 : int(0, 200));
      for (const r of rows) { b += r.amount; r.balance_after = b; }
    }

    return {
      schema: SCHEMA,
      worlds: [[1, 'アルファ'], [2, 'ベータ'], [3, 'ガンマ']],
      items: MST_ITEMS, products: PRODUCTS, equips: MST_EQUIPS,
      events: EVENTS, gachas: GACHAS, lineups: LINEUPS, stages: STAGES,
      // ここで JST に変換して書き出す
      users: users.map((u) => [u.id, u.pub, u.platform, u.status, toJ(u.created)]),
      characters: chars.map((c) => [c.id, c.user.id, c.world, c.name, c.job, c.level, toJ(c.created), toJ(c.deleted)]),
      login: L.login.map((r) => [r.id, r.user_id, r.result, r.ip_address, r.country, r.device_id, fmtJ(r._t)]),
      charlog: L.charlog.map((r) => [r.id, r.user_id, r.character_id, r.action, r.detail, r.ip_address, r.device_id, fmtJ(r._t)]),
      item: L.item.map((r) => [r.id, r.user_id, r.character_id, r.item_id, r.action, r.quantity, r.target_user_id, r.detail, fmtJ(r._t)]),
      equip: L.equip.map((r) => [r.id, r.user_id, r.character_id, r.item_id, r.item_uid, r.action, r.target_user_id, r.detail, fmtJ(r._t)]),
      usrEquips: [...owned.values()].sort((a, b) => a.user_id - b.user_id || a._t - b._t).map((o) => [o.uid, o.user_id, o.character_id, o.equip_id, o.level, o.in_storage, fmtJ(o._t)]),
      gacha: L.gacha.map((r) => [r.id, r.user_id, r.gacha_id, r.curRow.id, r.reward_type, r.reward_id, r.rarity, fmtJ(r._t)]),
      usrGachas: [...UG.values()].sort((a, b) => a.user_id - b.user_id || (a.gacha_id < b.gacha_id ? -1 : 1))
        .map((g) => [g.user_id, g.gacha_id, g.draws, fmtJ(g.first), fmtJ(g.last)]),
      usrCeilings: [...UG.values()].sort((a, b) => a.user_id - b.user_id || (a.gacha_id < b.gacha_id ? -1 : 1))
        .map((g) => [g.user_id, g.gacha_id, g.point, g.exchanged, fmtJ(g.last)]),
      ceilings: CEILINGS, missions: MISSIONS,
      usrMissions: UM.map((m) => [m.user_id, m.mission_id, m.progress, m.cleared == null ? null : fmtJ(m.cleared), m.recv == null ? null : fmtJ(m.recv), fmtJ(m.updated)]),
      stage: L.stage.map((r) => [r.id, r.user_id, r.character_id, r.stage_id, r.result, r.score, r.clear_time_sec, fmtJ(r._t)]),
      rankings: RANK.map((r) => [r.event_id, r.user_id, r.score, r.rank, fmtJ(r._t)]),
      presents: PRES.map((p) => [p.id, p.user_id, p.type, p.reward_id, p.qty, p.title, p.source, fmtJ(p._t), fmtJ(p.exp), p.recv == null ? null : fmtJ(p.recv)]),
      cur: L.cur.map((r) => [r.id, r.user_id, r.currency, r.amount, r.balance_after, r.reason, r.ref_id, fmtJ(r._t)]),
      pay: L.pay.map((r) => [r.id, r.user_id, r.product_id, r.price_jpy, r.store, r.transaction_id, r.status, fmtJ(r._t)]),
      err: L.err.map((r) => [r.id, r.level, r.service, typeof r.message === 'function' ? r.message() : r.message, r.user_id, fmtJ(r._t)]),
      keys: KEY,
    };
  }

  function buildDatabase(SQL, seed) {
    const g = generate(seed);
    const db = new SQL.Database();
    db.run(g.schema);
    db.run('BEGIN');
    const ins = (table, rows) => {
      if (!rows.length) return;
      const st = db.prepare(`INSERT INTO ${table} VALUES (${rows[0].map(() => '?').join(',')})`);
      for (const r of rows) st.run(r);
      st.free();
    };
    const data = {
      mst_worlds: g.worlds, mst_items: g.items, mst_products: g.products, mst_equips: g.equips,
      mst_events: g.events, mst_gachas: g.gachas, mst_gacha_lineups: g.lineups, mst_stages: g.stages,
      mst_gacha_ceilings: g.ceilings, mst_missions: g.missions,
      usr_users: g.users, usr_characters: g.characters, usr_equips: g.usrEquips, usr_gachas: g.usrGachas, usr_gacha_ceilings: g.usrCeilings,
      usr_missions: g.usrMissions, usr_rankings: g.rankings, usr_presents: g.presents,
      log_login: g.login, log_character: g.charlog, log_item: g.item, log_equip: g.equip, log_currency: g.cur,
      log_payment: g.pay, log_error: g.err, log_gacha: g.gacha, log_stage: g.stage,
    };
    for (const [t, rows] of Object.entries(data)) ins(t, rows);
    db.run('COMMIT');
    return { db, keys: g.keys, counts: Object.fromEntries(Object.entries(data).map(([t, rows]) => [t, rows.length])) };
  }

  const api = { buildDatabase, generate, toT, fmt, fmtJ, WEND };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.LogDB = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * ログは嘘をつかない — 問い合わせ票の自動生成
 * DBの実際のデータから、問い合わせ（答えが1つに決まるもの）を種類ごとに作る。
 * 正解・根拠の値・解説・模範SQLはすべてDBの値から組み立てるので、データと食い違わない。
 * データは乱数シード固定なので、誰が遊んでも同じ93件になる。
 */
(function (root) {
  'use strict';

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sub = (pub) => `(SELECT user_id FROM usr_users WHERE public_id = '${pub}')`;
  const norm = (s) => String(s || '').normalize('NFKC').replace(/[\s#"'`,，]/g, '').toUpperCase();
  const numAccept = (...ids) => (v) => { const n = parseInt(norm(v).replace(/^(LOG_?ID|PRESENT_?ID|ID)[:=]?/, ''), 10); return ids.includes(n); };
  const strAccept = (...vals) => (v) => vals.map(norm).includes(norm(v));
  const md = (ts) => `${+ts.slice(5, 7)}月${+ts.slice(8, 10)}日`;
  const hm = (ts) => ts.slice(11, 16);
  const when = (ts) => `${md(ts)} ${hm(ts)}`;
  const num = (n) => Number(n).toLocaleString();
  const day = (ts) => ts.slice(0, 10);
  const WINDOW = "BETWEEN '2026-10-21 00:00:00' AND '2026-11-12 20:00:00'";
  // 元の7問のユーザーと、その関係者は使わない
  const EXCLUDE = ['U-38127', 'U-52904', 'U-27730', 'U-44590', 'U-73315', 'U-61458', 'U-90417', 'U-15562', 'U-31846'];

  function mulberry32(a) {
    return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function addMinutes(ts, m) { const d = new Date(ts.replace(' ', 'T') + 'Z'); d.setUTCMinutes(d.getUTCMinutes() + m); return d.toISOString().slice(0, 19).replace('T', ' '); }
  const CAP = '2026-11-13 09:45:00';
  // 出来事のあと、数時間〜1日半ほどして問い合わせが届く
  function receivedAfter(ts, k) { let r = addMinutes(ts, 90 + ((k * 137) % 2000)); if (r > CAP) r = CAP; return r.slice(0, 16); }

  function build(DB) {
    const rows = (sql) => { const r = DB.exec(sql); if (!r.length) return []; const cols = r[0].columns; return r[0].values.map((v) => Object.fromEntries(cols.map((c, i) => [c, v[i]]))); };
    const exIds = new Set(rows(`SELECT user_id FROM usr_users WHERE public_id IN (${EXCLUDE.map((p) => `'${p}'`).join(',')})`).map((r) => r.user_id));
    const used = new Set(exIds);
    const worldName = Object.fromEntries(rows('SELECT world_id, name FROM mst_worlds').map((r) => [r.world_id, r.name]));
    const mainWorld = (uid) => { const r = rows(`SELECT w.name FROM usr_characters c JOIN mst_worlds w USING (world_id) WHERE c.user_id = ${uid} AND c.deleted_at IS NULL ORDER BY c.level DESC LIMIT 1`); return r.length ? r[0].name : '（未記入）'; };
    // 候補を全期間からまんべんなく選び、同じユーザーは1回だけ使う
    function pick(cands, n) {
      const out = [];
      if (!cands.length) return out;
      const step = Math.max(1, Math.floor(cands.length / Math.max(1, n)));
      const order = [];
      for (let s = 0; s < step; s++) for (let i = s; i < cands.length; i += step) order.push(i);
      for (const i of order) { if (out.length >= n) break; const c = cands[i]; if (used.has(c.user_id)) continue; used.add(c.user_id); out.push(c); }
      return out;
    }

    let seq = 0;
    const LETTERS = ['a', 'b', 'c', 'd'];
    function mk(o) {
      seq++;
      // 選択肢の並びはケースごとに固定のシャッフル
      const all = [[o.correct, true], ...o.wrongs.map((w) => [w, false])];
      const r = mulberry32(seq * 7919 + 13);
      for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
      return {
        id: `g${seq}`, generated: true, kind: o.kind, tier: o.tier,
        no: `CS-${o.received.slice(5, 7)}${o.received.slice(8, 10)}-${String(2000 + seq)}`,
        label: o.label, received: o.received, user: o.pub, world: o.world || '（未記入）', category: o.category,
        body: o.body, note: o.note,
        options: all.map((x, i) => [LETTERS[i], x[0]]), answer: LETTERS[all.findIndex((x) => x[1])],
        evidence: o.evidence, hints: o.hints, reply: o.reply, reaction: o.reaction, explain: o.explain, model: o.model,
        honest: o.honest, spec: o.spec !== false, temper: o.temper || 3,
      };
    }
    const vary = (arr, k) => arr[k % arr.length];

    // ======================================================================== Tier 1
    const T = {};
    T.sell = (n) => pick(rows(`
      SELECT e.log_id, e.user_id, u.public_id pub, e.equip_uid uid, e.created_at ts, m.name equip, c.name chara, w.name world, cur.log_id cur_id, cur.amount gold
      FROM log_equip e JOIN usr_users u ON u.user_id = e.user_id JOIN mst_equips m ON m.equip_id = e.equip_id
      LEFT JOIN usr_characters c ON c.character_id = e.character_id LEFT JOIN mst_worlds w ON w.world_id = c.world_id
      JOIN log_currency cur ON cur.user_id = e.user_id AND cur.reason = 'SELL_ITEM' AND cur.ref_id = e.equip_uid
      WHERE e.action = 'SELL' AND e.created_at ${WINDOW} AND m.rarity IN ('R', 'SR', 'SSR')
        AND (SELECT COUNT(*) FROM log_equip x WHERE x.user_id = e.user_id AND x.equip_id = e.equip_id AND x.action = 'SELL') = 1
        AND (SELECT COUNT(*) FROM usr_equips y WHERE y.user_id = e.user_id AND y.equip_id = e.equip_id) = 0
      ORDER BY e.log_id`), n).map((r, k) => mk({
      kind: 'sell', tier: 1, label: '装備消失', category: 'アイテム', pub: r.pub, world: r.world, temper: 3,
      received: receivedAfter(r.ts, r.log_id),
      body: vary([`『${r.equip}』が装備一覧から消えています。売った覚えはありません。不具合ですか？`, `大事にしていた『${r.equip}』がなくなりました。誰かに盗まれたんでしょうか。`, `『${r.equip}』がどこにもありません。倉庫も探しました。返してください。`], k),
      note: vary(['ユーザーは「売っていない」と強く主張しています。', '同じような報告は、ほかに届いていません。'], k),
      correct: '本人によるNPCショップへの売却', wrongs: ['強化の失敗による消滅', '他のプレイヤーへのトレード', '不具合による消失'],
      evidence: { label: '決め手になったログの log_id（log_equip）', placeholder: '例: 1234', table: 'log_equip', id: r.log_id, accept: numAccept(r.log_id) },
      hints: ['装備の名前は <code>mst_equips</code> にあります。equip_id を調べて、log_equip をユーザーと装備で絞り込みましょう。',
        '<code>ORDER BY created_at</code> で並べて、最後の action を見ましょう。',
        "売却なら log_currency に <code>reason = 'SELL_ITEM'</code> で、ref_id が装備の個体ID（equip_uid）の行があるはずです。"],
      reply: `お問い合わせありがとうございます。調査の結果、『${r.equip}』は${when(r.ts)}に、お客様のキャラクター『${r.chara}』からNPCショップへ売却され、${num(r.gold)}ゴールドを受け取られていることを確認いたしました。売却されたアイテムの復元は承っておりません。何卒ご理解ください。`,
      reaction: vary(['まとめて売ったときに、一緒に売っちゃってました……。', '整理したときにうっかり……。お騒がせしました。', 'ロックをかけ忘れてました。'], k),
      explain: `${when(r.ts)} に『${esc(r.chara)}』が『${esc(r.equip)}』（個体ID ${esc(r.uid)}）を売却しています（log_equip の <code>SELL</code>、log_id ${r.log_id}）。同じ時刻に log_currency に <code>SELL_ITEM</code> で ${num(r.gold)} ゴールドが入っていて、ref_id が同じ個体IDです。強化での消滅やトレードの記録はなく、<code>usr_equips</code> にも残っていません。`,
      model: `SELECT * FROM mst_equips WHERE name = '${r.equip}';

SELECT log_id, action, equip_uid, detail, created_at
FROM log_equip
WHERE user_id = ${sub(r.pub)}
  AND equip_id = (SELECT equip_id FROM mst_equips WHERE name = '${r.equip}')
ORDER BY created_at;

SELECT * FROM log_currency
WHERE user_id = ${sub(r.pub)} AND reason = 'SELL_ITEM' AND ref_id = '${r.uid}';`,
      honest: `ご自分で売っています。${num(r.gold)}ゴールドで。……安すぎませんか。`,
    }));

    T.expire = (n) => pick(rows(`
      SELECT i.log_id, i.user_id, u.public_id pub, i.created_at ts, m.name item, w.name world
      FROM log_item i JOIN usr_users u ON u.user_id = i.user_id JOIN mst_items m ON m.item_id = i.item_id
      LEFT JOIN usr_characters c ON c.character_id = i.character_id LEFT JOIN mst_worlds w ON w.world_id = c.world_id
      WHERE i.action = 'EXPIRE' AND i.created_at ${WINDOW}
        AND (SELECT COUNT(*) FROM log_item x WHERE x.user_id = i.user_id AND x.item_id = i.item_id AND x.action = 'EXPIRE') = 1
      ORDER BY i.log_id`), n).map((r, k) => {
      const dur = (r.item.match(/（(.+?)）/) || [])[1] || '期間限定';
      return mk({
        kind: 'expire', tier: 1, label: 'マウント消失', category: 'アイテム', pub: r.pub, world: r.world, temper: 3,
        received: receivedAfter(r.ts, r.log_id),
        body: vary([`『${r.item}』に乗れなくなりました！せっかく手に入れたのに、勝手に消えるなんておかしいです。`, `マウントの『${r.item}』がいなくなっています。どこに行ったんですか？`], k),
        note: 'マウントはイベントの報酬で配られたものです。',
        correct: '期限付きアイテムの期限切れ（仕様どおり）', wrongs: ['本人によるトレード', '本人による売却', '不具合による消失'],
        evidence: { label: '決め手になったログの log_id（log_item）', placeholder: '例: 1234', table: 'log_item', id: r.log_id, accept: numAccept(r.log_id) },
        hints: ['アイテム名は <code>mst_items</code> にあります。名前をよく見てみましょう。', 'log_item をそのユーザーとアイテムで絞り込み、action を確認しましょう。', '<code>EXPIRE</code> は有効期限が切れたことを表します。'],
        reply: `お問い合わせありがとうございます。調査の結果、『${r.item}』は期間限定のマウントで、${when(r.ts)}に有効期限を迎えたため、自動的に消滅していることを確認いたしました。仕様どおりの挙動となりますので、何卒ご理解ください。`,
        reaction: vary([`名前に（${dur}）って書いてありました……。`, '期限があるの、知りませんでした。'], k),

    const UNIT = { LOGIN: '日', STAGE_CLEAR: '回', RAID_CLEAR: '回', GACHA_DRAW: '回', ENHANCE_SUCCESS: '回', GUILD_DONATE: 'ゴールド', CHARACTER_CREATE: '体' };

    T.mission = (n) => {
      const all = rows(`
        SELECT um.user_id, u.public_id pub, um.mission_id mid, m.name, m.mission_type mtype, m.condition_type ctype, m.condition_value target,

        FROM usr_missions um JOIN usr_users u ON u.user_id = um.user_id JOIN mst_missions m ON m.mission_id = um.mission_id
        LEFT JOIN mst_items i ON i.item_id = m.reward_id
        ORDER BY um.mission_id, um.user_id`);
      const half = Math.ceil(n / 2);
      const unrecv = pick(all.filter((r) => r.cleared && !r.recv && r.cleared <= '2026-11-13 09:00:00'), half);
      const notyet = pick(all.filter((r) => !r.cleared && r.target > 1 && r.progress >= r.target / 2 && r.mtype !== 'DAILY'), n - unrecv.length);
      return [...unrecv, ...notyet].map((r, k) => {
        const done = !!r.cleared;

            : `お問い合わせありがとうございます。調査の結果、ミッション「${r.name}」の進み具合は${num(r.progress)}／${num(r.target)}で、まだ達成されておりません。あと${num(left)}${unit}で達成となります。`,
          reaction: done ? '受け取るボタン、押してませんでした。' : '数え間違えてました……。',
          explain: done ? `mst_missions で「${esc(r.name)}」は mission_id ${r.mid}、必要数 ${num(r.target)}。usr_missions の progress は ${num(r.progress)} で、${when(r.cleared)} に達成（cleared_at）。received_at は NULL なので、報酬（${esc(reward)}）をまだ受け取っていません。`
            : `mst_missions で「${esc(r.name)}」は mission_id ${r.mid}、必要数 ${num(r.target)}。usr_missions の progress は ${num(r.progress)} で、あと ${num(left)}${unit} 足りません。${PERIOD[r.mtype]}cleared_at も NULL です。`,
          model: `SELECT * FROM mst_missions WHERE name = '${r.name}';

SELECT * FROM usr_missions
WHERE user_id = ${sub(r.pub)}
  AND mission_id = ${r.mid};`,
          honest: done ? '「受け取る」を押してください。' : `あと${num(left)}${unit}です。数えてください。`,
        });

      explain: `${when(r.del_at)} に DELETE（log_id ${r.del_id}）、${when(r.ts)} に RESTORE（log_id ${r.log_id}）。RESTORE の detail は <code>by: cs_ticket</code>（CSへの問い合わせにもとづく復旧）で、ip_address・device_id は NULL（ユーザーの端末ではなく、運営側の操作）です。`,
      model: `SELECT log_id, character_id, action, detail, ip_address, device_id, created_at
FROM log_character
WHERE user_id = ${sub(r.pub)}
ORDER BY created_at;`,
      honest: 'ご自分でCSに「戻してください」と頼んでいます。',
    }));

    T.world = (n) => pick(rows(`
      SELECT l.log_id, l.user_id, u.public_id pub, l.created_at ts, l.detail, c.name chara, c.world_id now_w
      FROM log_character l JOIN usr_users u ON u.user_id = l.user_id JOIN usr_characters c ON c.character_id = l.character_id
      WHERE l.action = 'WORLD_TRANSFER' AND l.created_at <= '2026-11-12 20:00:00' ORDER BY l.log_id`), n).map((r) => {
      const d = JSON.parse(r.detail);
      const from = worldName[d.from_world], to = worldName[d.to_world];
      return mk({
        kind: 'world', tier: 3, label: 'キャラ不在', category: 'キャラクター', pub: r.pub, world: from, temper: 4,
        received: receivedAfter(r.ts, r.log_id),
        body: `キャラクター『${r.chara}』が${from}のキャラ一覧から消えています！削除なんてしていません！`,
        note: `ユーザーは「${from}」で遊んでいるとのことです。`,
        correct: '本人の操作によるワールド移動（キャラクターは無事）', wrongs: ['本人の操作による削除', '本人の操作による名前変更', '不具合によるキャラクターの消失'],
        evidence: { label: `『${r.chara}』が今いるワールド名`, placeholder: '例: ベータ', value: to, accept: (v) => { const x = norm(v); return x.includes(norm(to)) || x === String(d.to_world) || x === `ワールド${d.to_world}`; } },
        hints: ["usr_characters で <code>name</code> を検索してみましょう。world_id はどこ？", 'world_id は <code>mst_worlds</code> テーブルと対応しています。', 'log_character でこのキャラの action を確認しましょう。detail に移動元と移動先が入っています。'],
        reply: `お問い合わせありがとうございます。調査の結果、『${r.chara}』は${when(r.ts)}にワールド移動チケットを使用して、${from}から${to}へ移動しております。キャラクターは削除されておりませんので、${to}にログインしてご確認ください。`,
        reaction: 'イベントにつられて移動したの、完全に忘れてました……。',
        explain: `log_character の WORLD_TRANSFER（${when(r.ts)}、log_id ${r.log_id}）の detail は <code>${esc(r.detail)}</code>。usr_characters の world_id も ${r.now_w}（${esc(worldName[r.now_w])}）です。直前に log_item でワールド移動チケット（1201）を使っています。`,
        model: `SELECT c.*, w.name AS world_name
FROM usr_characters c JOIN mst_worlds w USING (world_id)
WHERE c.name = '${r.chara}';

SELECT log_id, action, detail, created_at
FROM log_character
WHERE user_id = ${sub(r.pub)}
ORDER BY created_at;`,
        honest: `消えていません。${to}にいます。あなたが連れて行きました。`,
      });
    });

    const RANK_OPTS = ['報酬は受け取り済み', 'プレゼントBOXに届いている（まだ受け取っていない）', '順位が報酬の対象外', '不具合で届いていない'];
    T.rank = (n) => {
      const all = rows(`
        SELECT r.user_id, u.public_id pub, r.rank, r.score, p.present_id, p.title, p.received_at recv, p.created_at ts, p.present_type ptype, p.quantity qty, i.name item, c.log_id cur_id
        FROM usr_rankings r JOIN usr_users u ON u.user_id = r.user_id
        JOIN usr_presents p ON p.user_id = r.user_id AND p.source = 'EVENT'
        LEFT JOIN mst_items i ON i.item_id = p.reward_id
        LEFT JOIN log_currency c ON c.user_id = r.user_id AND c.reason = 'PRESENT' AND c.ref_id = 'present:' || p.present_id
        WHERE r.event_id = 'ev_raid_star' ORDER BY r.rank`);
      const half = Math.ceil(n / 2);
      return [...pick(all.filter((r) => !r.recv), half), ...pick(all.filter((r) => r.recv && r.recv <= '2026-11-12 20:00:00'), n - half)].map((r) => {
        const got = !!r.recv;
        const reward = r.ptype === 'GEM' ? `ジェム${num(r.qty)}個` : `${r.item}×${r.qty}`;
        return mk({
          kind: 'rank', tier: 3, label: 'ランキング報酬', category: 'イベント', pub: r.pub, world: mainWorld(r.user_id), temper: 3,
          received: receivedAfter(got ? r.recv : r.ts, r.present_id),
          body: '星喰いの竜 討伐戦の順位報酬が、まだ届いていません。上位に入っていたはずなんですが……。',
          note: '順位報酬は、イベント終了後にプレゼントBOXへ配布しています。',
          correct: RANK_OPTS[got ? 0 : 1], wrongs: others(RANK_OPTS, RANK_OPTS[got ? 0 : 1]),
          evidence: { label: 'このユーザーの最終順位（rank）', placeholder: '例: 12', value: String(r.rank), accept: numAccept(r.rank) },
          hints: ["イベントIDは mst_events にあります。usr_rankings で <code>event_id = 'ev_raid_star'</code> の順位を見ましょう。", 'usr_presents に、順位報酬（source = EVENT）が届いているか確認しましょう。', 'received_at が入っていれば受け取り済み、NULL なら未受け取りです。'],
          reply: got ? `お問い合わせありがとうございます。調査の結果、お客様の最終順位は${r.rank}位で、順位報酬（${reward}）は${when(r.recv)}にお受け取りいただいていることを確認いたしました。`
            : `お問い合わせありがとうございます。調査の結果、お客様の最終順位は${r.rank}位で、順位報酬（${reward}）は${when(r.ts)}にプレゼントBOXへお届けしております。プレゼントBOXからお受け取りください。`,
          reaction: got ? 'もらってました。使ったのを忘れてました。' : 'BOXにありました！ありがとうございます！',
          explain: `usr_rankings（ev_raid_star）で ${r.rank} 位（与ダメージ ${num(r.score)}）。usr_presents に「${esc(r.title)}」（${esc(reward)}、present_id ${r.present_id}）が ${when(r.ts)} に届いていて、${got ? `${when(r.recv)} に受け取り済みです${r.cur_id ? `（log_currency の PRESENT、log_id ${r.cur_id}）` : ''}。` : 'received_at は NULL（未受け取り）です。'}`,
          model: `SELECT * FROM usr_rankings
WHERE event_id = 'ev_raid_star' AND user_id = ${sub(r.pub)};

SELECT * FROM usr_presents
WHERE user_id = ${sub(r.pub)} AND source = 'EVENT';`,
          honest: got ? 'もう受け取っています。' : 'プレゼントBOXを開いてください。',
        });
      });
    };

    // ======================================================================== 組み立て（合計 target 件）
    // 候補の少ない種類から先に選ぶ（同じユーザーは1回しか使わないため）
    const PLAN = [['restore', 3], ['world', 3], ['rename', 5], ['del', 5], ['rank', 4], ['expire', 5], ['maint', 7], ['payCancel', 5],
      ['loginFail', 6], ['gold', 8], ['ceiling', 5], ['noSsr', 5], ['mission', 10], ['loginBonus', 5], ['payOk', 6], ['sell', 6], ['trade', 5]];
    const out = [];
    for (const [k, n] of PLAN) out.push(...T[k](n));
    // 足りなければ、候補の多い種類で埋める
    const FILL = ['trade', 'gold', 'sell', 'payOk', 'loginBonus', 'loginFail', 'noSsr'];
    for (let f = 0; out.length < 93 && f < FILL.length * 3; f++) out.push(...T[FILL[f % FILL.length]](Math.min(2, 93 - out.length)));
    return out.slice(0, 93);
  }

  // ========================================================================== 研修（DAY 1 の前のチュートリアル）
  // 本番の100件と重ならないユーザーから、手順を教えやすい3件を毎回同じように選ぶ。
  // facts には、研修の各ステップの達成判定に使う値（user_id など）を入れておく。
  function training(DB, excludePubs) {
    const rows = (sql) => { const r = DB.exec(sql); if (!r.length) return []; const cols = r[0].columns; return r[0].values.map((v) => Object.fromEntries(cols.map((c, i) => [c, v[i]]))); };
    const pubs = [...new Set([...EXCLUDE, ...(excludePubs || [])])];
    const used = new Set(rows(`SELECT user_id FROM usr_users WHERE public_id IN (${pubs.map((p) => `'${p}'`).join(',')})`).map((r) => r.user_id));
    const first = (list) => { const r = list.find((x) => !used.has(x.user_id)); if (r) used.add(r.user_id); return r; };
    const fixed = (o) => ({ generated: true, training: true, tier: 0, temper: 2, spec: false, ...o });
    const out = [];

    // 研修1：キャラが消えた？ → usr_users で user_id を引き、usr_characters を見るだけ（消えていない）
    const a = first(rows(`
      SELECT u.user_id, u.public_id pub, c.character_id, c.name chara, c.level, c.job, w.name world
      FROM usr_users u JOIN usr_characters c USING (user_id) JOIN mst_worlds w USING (world_id)
      WHERE c.deleted_at IS NULL AND c.level >= 20
        AND (SELECT COUNT(*) FROM usr_characters x WHERE x.user_id = u.user_id) = 1
        AND (SELECT COUNT(*) FROM usr_characters x WHERE x.name = c.name) = 1
        AND NOT EXISTS (SELECT 1 FROM log_character x WHERE x.user_id = u.user_id AND x.action <> 'CREATE')
      ORDER BY u.user_id`));
    if (a) {
      out.push(fixed({
        id: 't1', no: 'TR-0001', label: 'キャラが消えた？', received: '2026-11-13 09:05', user: a.pub, world: a.world, category: 'キャラクター',
        body: `アプリを入れ直したら、キャラクター選択画面に『${a.chara}』がいません！レベル${a.level}まで育てたのに……消えてしまったんですか？`,
        note: '研修用のチケットです。まずは、キャラクターが本当に消えているかを確かめましょう。',
        options: [['a', 'キャラクターは消えていない（今もアカウントに残っている）'], ['b', '本人の操作による削除'], ['c', '第三者の不正ログインによる削除'], ['d', '不具合によるデータ消失']],
        answer: 'a',
        evidence: { label: `『${a.chara}』の character_id`, placeholder: '例: 123', table: null, value: String(a.character_id), accept: numAccept(a.character_id) },
        hints: ['usr_users を公開ID（public_id）で検索すると、内部の <code>user_id</code> が分かります。', `usr_characters を <code>WHERE user_id = ${a.user_id}</code> で絞り込みましょう。`, '<code>deleted_at</code> が NULL なら、削除されていません。'],
        reply: `お問い合わせありがとうございます。調査の結果、『${a.chara}』（レベル${a.level}）はお客様のアカウントに残っており、削除などの操作も行われていないことを確認いたしました。アプリの再インストール後は、引き継ぎ済みのアカウントでログインされているかご確認ください。`,
        reaction: 'ゲストでログインしてました！引き継ぎしたら出てきました！',
        explain: `usr_users で ${esc(a.pub)} を引くと user_id は ${a.user_id}。usr_characters を user_id で絞ると『${esc(a.chara)}』（character_id ${a.character_id}）が見つかり、<code>deleted_at</code> は NULL（未削除）です。log_character にも作成以外の操作はありません。消えていないので、ログインしているアカウントが違う可能性が高いです。`,
        model: `SELECT * FROM usr_users WHERE public_id = '${a.pub}';

SELECT * FROM usr_characters WHERE user_id = ${a.user_id};`,
        honest: '消えていません。たぶん、ログインしているアカウントが違います。',
        facts: { user_id: a.user_id, character_id: a.character_id },
      }));
    }

    // 研修2：ポーションが減った → ログを時系列に並べ、マスターと JOIN する（本人が使った）
    const b = first(rows(`
      SELECT l.log_id, l.user_id, u.public_id pub, l.quantity, l.created_at ts, m.name item, m.item_id
      FROM log_item l JOIN usr_users u USING (user_id) JOIN mst_items m USING (item_id)
      WHERE l.item_id = 1001 AND l.action = 'USE' AND l.quantity >= 3 AND l.created_at BETWEEN '2026-11-10 00:00:00' AND '2026-11-12 22:00:00'
        AND NOT EXISTS (SELECT 1 FROM log_item x WHERE x.user_id = l.user_id AND x.item_id = l.item_id AND x.created_at > l.created_at)
        AND NOT EXISTS (SELECT 1 FROM log_item x WHERE x.user_id = l.user_id AND x.item_id = l.item_id AND x.action IN ('TRADE_OUT', 'EXPIRE'))
      ORDER BY l.log_id`));
    if (b) {
      const w = rows(`SELECT w.name FROM usr_characters c JOIN mst_worlds w USING (world_id) WHERE c.user_id = ${b.user_id} AND c.deleted_at IS NULL ORDER BY c.level DESC LIMIT 1`);
      out.push(fixed({
        id: 't2', no: 'TR-0002', label: 'ポーションが減った', received: receivedAfter(b.ts, 3), user: b.pub, world: w.length ? w[0].name : '（未記入）', category: 'アイテム',
        body: `ポーションが${b.quantity}個、勝手に減っています！前に確認したときは、まだあったはずです。`,
        note: '研修用のチケットです。アイテムの増減は log_item に記録されています。',
        options: [['a', '他のプレイヤーへのトレード'], ['b', '期限切れによる消滅'], ['c', '本人が使用した（使用の記録がある）'], ['d', '不具合による消失']],
        answer: 'c',
        evidence: { label: '決め手になったログの log_id（log_item）', placeholder: '例: 1234', table: 'log_item', id: b.log_id, accept: numAccept(b.log_id) },
        hints: ['まずは usr_users で <code>user_id</code> を調べましょう。', `log_item を <code>WHERE user_id = ${b.user_id}</code> で絞り、<code>ORDER BY created_at DESC</code> で新しい順に並べましょう。`, "item_id だけでは何のアイテムか分かりません。<code>JOIN mst_items USING (item_id)</code> で名前を付けて、ポーションの <code>USE</code> を探しましょう。"],
        reply: `お問い合わせありがとうございます。調査の結果、${when(b.ts)}に、お客様のキャラクターがポーションを${b.quantity}個使用された記録を確認いたしました。トレードや不具合による消失ではございません。`,
        reaction: 'ボス戦で連打してました……。',
        explain: `log_item を user_id ${b.user_id} で絞って新しい順に並べ、mst_items と JOIN すると、item_id ${b.item_id} はポーション。ポーションの最後の記録は ${when(b.ts)} の <code>USE</code>（${b.quantity}個、log_id ${b.log_id}）で、本人が使っています。トレード（TRADE_OUT）や期限切れ（EXPIRE）の記録はありません。`,
        model: `SELECT * FROM usr_users WHERE public_id = '${b.pub}';

SELECT l.log_id, m.name, l.action, l.quantity, l.created_at
FROM log_item l
JOIN mst_items m USING (item_id)
WHERE l.user_id = ${b.user_id}
ORDER BY l.created_at DESC;`,
        honest: `ご自分で飲んでいます。${b.quantity}個まとめて。`,
        facts: { user_id: b.user_id, log_id: b.log_id },
      }));
    }

    // 研修3：ログインできなかった → 日付と AND で絞り込む（その日も普通にログインしている）
    const c = first(rows(`
      SELECT l.user_id, u.public_id pub, COUNT(*) n, MIN(l.log_id) log_id, MIN(l.created_at) ts
      FROM log_login l JOIN usr_users u USING (user_id)
      WHERE date(l.created_at) = '2026-11-11'
      GROUP BY l.user_id
      HAVING n >= 2 AND SUM(l.result = 'SUCCESS') = n
      ORDER BY l.user_id`));
    if (c) {
      const ok = rows(`SELECT log_id, created_at FROM log_login WHERE user_id = ${c.user_id} AND date(created_at) = '2026-11-11' AND result = 'SUCCESS' ORDER BY created_at`);
      const w = rows(`SELECT w.name FROM usr_characters x JOIN mst_worlds w USING (world_id) WHERE x.user_id = ${c.user_id} AND x.deleted_at IS NULL ORDER BY x.level DESC LIMIT 1`);
      out.push(fixed({
        id: 't3', no: 'TR-0003', label: 'ログインできない', received: '2026-11-12 10:20', user: c.pub, world: w.length ? w[0].name : '（未記入）', category: 'アカウント',
        body: '11月11日は一日中ログインできませんでした！サーバーが落ちていたんですよね？ログインボーナスを取り逃したので補填してください。',
        note: '研修用のチケットです。11月11日にサーバー障害は起きていません。',
        options: [['a', 'サーバー障害でログインできなかった'], ['b', 'その日もログインできている（成功の記録がある）'], ['c', 'パスワードの入力ミスが続いてロックされた'], ['d', '第三者にパスワードを変えられた']],
        answer: 'b',
        evidence: { label: '11月11日のログインの log_id（log_login）', placeholder: '例: 1234', table: 'log_login', id: ok[0].log_id, accept: numAccept(...ok.map((r) => r.log_id)) },
        hints: ['usr_users で <code>user_id</code> を調べましょう。', "log_login を user_id で絞り、さらに <code>AND date(created_at) = '2026-11-11'</code> で日付を絞りましょう。", '<code>result</code> が SUCCESS なら、ログインに成功しています。'],
        reply: `お問い合わせありがとうございます。調査の結果、11月11日は${ok.map((r) => r.created_at.slice(11, 16)).join('、')}に、お客様のアカウントへのログインに成功した記録を確認いたしました。また、同日にサーバー障害は発生しておりません。そのため、補填の対象外となります。`,
        reaction: '別の日と勘違いしてました……。',
        explain: `log_login を user_id ${c.user_id} と <code>date(created_at) = '2026-11-11'</code> の AND で絞ると、${ok.length}件ともすべて <code>SUCCESS</code>（最初は ${when(ok[0].created_at)}、log_id ${ok[0].log_id}）。失敗の記録はありません。ユーザーの言い分とログが食い違ったら、ログを信じます。`,
        model: `SELECT * FROM usr_users WHERE public_id = '${c.pub}';

SELECT log_id, result, ip_address, device_id, created_at
FROM log_login
WHERE user_id = ${c.user_id}
  AND date(created_at) = '2026-11-11'
ORDER BY created_at;`,
        honest: `普通にログインしています。${ok.length}回も。`,
        facts: { user_id: c.user_id, log_ids: ok.map((r) => r.log_id) },
      }));
    }
    return out;
  }

  root.CaseGen = { build, training };
  if (typeof module !== 'undefined' && module.exports) module.exports = { build, training };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * ログは嘘をつかない — 購買部の品ぞろえ
 * 品物の名前・値段・効果の説明と、ドット絵（12×12）。効果そのものは game.js が実装する。
 *   kind: consumable（消耗品。モニター上部のアイテム欄から使う。各 max 個まで）
 *         tool（調査ツール。一度買えばずっと使える。答えは教えず、調べる手間を減らすものだけ）

 *   from: 購買部に並び始める日
 *   where: 道具を買ったあと、画面のどこに出てくるか（購買部のカードに出す）
 */
(function (root) {
  'use strict';

  const K = '#1c1f33', W = '#fbf7ea';
  const ITEMS = [
    // ---------------------------------------------------------------- 消耗品
    { id: 'coffee', kind: 'consumable', name: '缶コーヒー', price: 120, max: 3, from: 1,
      desc: 'ゲーム内の時計を30分戻す。',
      pal: { k: K, w: W, g: '#9aa3b8', b: '#7a4a2a', o: '#c8874a' },
      px: ['....kkkk....', '...kggggk...', '...kwwwwk...', '...kbbbbk...', '...kbookk...', '...kbobbk...', '...kbookk...', '...kbbbbk...', '...kbbbbk...', '...kwwwwk...', '...kggggk...', '....kkkk....'] },
    { id: 'treat', kind: 'consumable', name: '先輩へのおごり', price: 150, max: 3, from: 1,
      desc: 'Kさんにおにぎりをおごる。次のヒント1回が減点なし。',
      pal: { k: K, w: W, n: '#26402f', p: '#e7dfc7' },
      px: ['.....kk.....', '....kwwk....', '...kwwwwk...', '...kwwwwk...', '..kwwwwwwk..', '..kwwpwwwk..', '.kwwwwwwwwk.', '.kwwnnnnwwk.', 'kwwwnnnnwwwk', 'kwwwnnnnwwwk', 'kwwwnnnnwwwk', 'kkkkkkkkkkkk'] },
    { id: 'medicine', kind: 'consumable', name: '胃薬', price: 200, max: 3, from: 1,

<script>
/*
 * ログは嘘をつかない — サウンド（BGM・効果音）
 * 音声ファイルは使わず、Web Audio API でその場で合成する（ダウンロード不要・ライセンス不要）。
 * ブラウザの自動再生制限があるため、最初のクリック／キー入力で AudioContext を作る。
 * 設定（BGM・効果音のオン/オフ）は localStorage に保存。使えない環境でも動く。
 */
(function (root) {
  'use strict';

  const PREF_KEY = 'logs-dont-lie:audio';
  const BGM_LEVEL = 0.32; // BGM の音量（効果音より控えめに）
  const MASTER = 0.8;

  const prefs = (() => {
    const d = { bgm: true, sfx: true };
    try { return Object.assign(d, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { return d; }
  })();
  const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* storage unavailable */ } };

  let ctx = null, master = null, bgmBus = null, sfxBus = null, noiseBuf = null;
  let bgmWanted = false;
  const listeners = [];

  function ensure() {
    if (!ctx) {
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = ctx.createGain(); master.gain.value = MASTER;
      master.connect(comp); comp.connect(ctx.destination);
      bgmBus = ctx.createGain(); bgmBus.gain.value = prefs.bgm ? BGM_LEVEL : 0; bgmBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => {});
    return ctx;
  }
  const ready = () => ctx && ctx.state === 'running';

  // ------------------------------------------------------------ 音の部品
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function tone(o) {
    const { t, f, dur, bus = sfxBus } = o;
    const type = o.type || 'sine', peak = o.gain == null ? 0.2 : o.gain, attack = o.attack || 0.004;
    const osc = ctx.createOscillator(); osc.type = type;
    osc.frequency.setValueAtTime(f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || dur));
    if (o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    if (o.hold) g.gain.setValueAtTime(peak, t + attack + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + (o.hold || 0) + dur);
    let node = osc;
    if (o.lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; fl.Q.value = o.q || 0.7; node.connect(fl); node = fl; }
    node.connect(g); g.connect(bus);
    osc.start(t); osc.stop(t + attack + (o.hold || 0) + dur + 0.05);
  }

  function noise(o) {
    const { t, dur, bus = sfxBus } = o;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = o.filter || 'bandpass';
    fl.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.freq2) fl.frequency.exponentialRampToValueAtTime(o.freq2, t + dur);
    fl.Q.value = o.q || 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.gain == null ? 0.2 : o.gain, t + (o.attack || 0.002));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(bus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  // エレピ風の短い音（サイン波＋倍音）
  function pluck(t, midi, len, gain, bus) {
    const f = mtof(midi);
    tone({ t, f, dur: Math.max(0.25, len), gain, bus, attack: 0.006 });
    tone({ t, f: f * 2, dur: 0.18, gain: gain * 0.35, bus, attack: 0.003 });
    tone({ t, f: f * 3.01, dur: 0.06, gain: gain * 0.12, bus, attack: 0.002 });
  }
  // ベル（正解や開始のチャイム）
  function bell(t, midi, gain, dur) {
    const f = mtof(midi);
    tone({ t, f, dur: dur || 0.9, gain, attack: 0.003 });
    tone({ t, f: f * 2.76, dur: (dur || 0.9) * 0.35, gain: gain * 0.25, attack: 0.002 });
    tone({ t, f: f * 5.4, dur: 0.12, gain: gain * 0.08, attack: 0.001 });
  }
  // 印鑑を押す「ドン」
  function thud(t, gain) {
    tone({ t, f: 140, f2: 48, glide: 0.12, dur: 0.22, gain: gain || 0.55, attack: 0.002 });
    noise({ t, dur: 0.09, gain: 0.25, filter: 'lowpass', freq: 900, q: 0.5 });
    noise({ t: t + 0.004, dur: 0.03, gain: 0.12, filter: 'bandpass', freq: 2400, q: 1.2 });
  }

  // ------------------------------------------------------------ 効果音
  const SFX = {
    // SQL実行：エンターキーの「カタッ」＋短い電子音
    run(t) { noise({ t, dur: 0.035, gain: 0.18, freq: 2600, q: 1.4 }); tone({ t: t + 0.03, f: 880, f2: 1320, glide: 0.05, dur: 0.07, gain: 0.07, type: 'triangle' }); },
    // 結果が返ってきた
    ok(t) { tone({ t: t + 0.09, f: 1318.5, dur: 0.08, gain: 0.05, type: 'triangle' }); tone({ t: t + 0.15, f: 1760, dur: 0.1, gain: 0.04, type: 'triangle' }); },
    // SQLエラー
    error(t) { tone({ t: t + 0.06, f: 233, dur: 0.09, gain: 0.08, type: 'square', lp: 1400 }); tone({ t: t + 0.17, f: 196, dur: 0.14, gain: 0.08, type: 'square', lp: 1200 }); },
    // 正解：解決の印鑑＋チャイム
    solved(t) {
      thud(t);
      [72, 76, 79, 84].forEach((m, i) => bell(t + 0.16 + i * 0.085, m, 0.13, 0.9));
      bell(t + 0.5, 88, 0.06, 1.4);
    },
    // 差し戻し：印鑑＋ブブー
    reject(t) {
      thud(t, 0.45);
      tone({ t: t + 0.14, f: 155, dur: 0.12, hold: 0.05, gain: 0.12, type: 'square', lp: 900 });
      tone({ t: t + 0.36, f: 131, dur: 0.22, hold: 0.08, gain: 0.12, type: 'square', lp: 800 });
    },
    // ヒント：ポロン
    hint(t) { bell(t, 79, 0.1, 0.6); bell(t + 0.1, 86, 0.08, 0.8); },
    // 始末書：警報
    shimatsu(t) {
      for (let i = 0; i < 3; i++) {
        tone({ t: t + i * 0.26, f: 880, f2: 620, glide: 0.22, dur: 0.06, hold: 0.16, gain: 0.07, type: 'square', lp: 2600 });
      }
      thud(t + 0.8, 0.4);
    },
    // インフラ担当からの警告など
    warn(t) { tone({ t, f: 1046.5, dur: 0.1, gain: 0.07, type: 'triangle' }); tone({ t: t + 0.13, f: 784, dur: 0.16, gain: 0.07, type: 'triangle' }); },
    // 小さな通知（根拠欄に入力、コピー など）
    pop(t) { tone({ t, f: 1200, f2: 1600, glide: 0.03, dur: 0.05, gain: 0.07, type: 'sine' }); },
    // チケットを切り替える：紙をめくる
    page(t) { noise({ t, dur: 0.12, gain: 0.1, filter: 'bandpass', freq: 1800, freq2: 5200, q: 0.6, attack: 0.03 }); },
    // 出社：起動チャイム
    start(t) { [60, 64, 67, 72].forEach((m, i) => pluck(t + i * 0.09, m, 0.5, 0.11, sfxBus)); bell(t + 0.38, 79, 0.07, 1.2); },
    // 先輩に聞く
    giveup(t) { [76, 72, 69].forEach((m, i) => pluck(t + i * 0.12, m, 0.4, 0.09, sfxBus)); },
    // チケット着信：電話のベル
    ring(t) {
      for (let k = 0; k < 2; k++) {
        for (let i = 0; i < 6; i++) {
          const tt = t + k * 0.42 + i * 0.045;
          tone({ t: tt, f: i % 2 ? 1568 : 1319, dur: 0.035, gain: 0.05, type: 'square', lp: 3200 });
        }
      }
    },
    // チケットの印字（プリンター）
    print(t) { for (let i = 0; i < 5; i++) noise({ t: t + i * 0.07, dur: 0.05, gain: 0.05, filter: 'bandpass', freq: 900 + i * 120, q: 2.5 }); },
    // 会話の文字送り
    type(t) { tone({ t, f: 520 + Math.random() * 120, dur: 0.025, gain: 0.025, type: 'square', lp: 1800 }); },
    // コンボ
    combo(t) { [76, 81, 86, 88].forEach((m, i) => tone({ t: t + i * 0.05, f: mtof(m), dur: 0.12, gain: 0.07, type: 'square', lp: 4000 })); },
    // スコアのカウントアップ
    tick(t) { tone({ t, f: 1900, dur: 0.02, gain: 0.02, type: 'square', lp: 5000 }); },
    // カットインの「シュッ」
    whoosh(t) { noise({ t, dur: 0.32, gain: 0.12, filter: 'bandpass', freq: 400, freq2: 4200, q: 0.9, attack: 0.08 }); },
    // 起動ログ
    boot(t) { [0, 0.08, 0.16].forEach((d, i) => tone({ t: t + d, f: 660 * (1 + i * 0.5), dur: 0.05, gain: 0.05, type: 'square', lp: 3000 })); },
    // 結果画面の1行（小さな印鑑）
    reveal(t) { thud(t, 0.25); },
    // 称号の発表
    rank(t) { thud(t, 0.6); [72, 79, 84, 88, 91].forEach((m, i) => bell(t + 0.12 + i * 0.07, m, 0.1, 1.2)); },
    // 証拠を叩きつける「バンッ」
    smash(t) { thud(t, 0.75); noise({ t, dur: 0.18, gain: 0.3, filter: 'lowpass', freq: 1800, q: 0.6 }); tone({ t, f: 90, f2: 40, glide: 0.2, dur: 0.3, gain: 0.4, type: 'triangle' }); },
    // 紙を丸める
    crumple(t) { for (let i = 0; i < 7; i++) noise({ t: t + i * 0.045 + Math.random() * 0.02, dur: 0.04, gain: 0.08, filter: 'bandpass', freq: 2500 + Math.random() * 2500, q: 1.5 }); },
    // 投げる
    toss(t) { noise({ t, dur: 0.25, gain: 0.08, filter: 'bandpass', freq: 600, freq2: 2400, q: 1, attack: 0.05 }); },
    // ゴミ箱に入った「カコーン」
    clang(t) { tone({ t, f: 1240, dur: 0.4, gain: 0.08, type: 'square', lp: 3000 }); tone({ t, f: 1870, dur: 0.3, gain: 0.05, type: 'triangle' }); thud(t, 0.2); },
    // 外れた「ポテッ」
    plop(t) { tone({ t, f: 220, f2: 110, glide: 0.1, dur: 0.12, gain: 0.12, type: 'triangle' }); },
    // 爆発・崩壊
    explode(t) { noise({ t, dur: 1.4, gain: 0.45, filter: 'lowpass', freq: 2400, freq2: 120, q: 0.4 }); tone({ t, f: 70, f2: 28, glide: 1.2, dur: 1.3, gain: 0.5, type: 'sine' }); thud(t, 0.8); },
    // ハンマー
    hammer(t) { thud(t, 0.9); tone({ t, f: 880, dur: 0.25, gain: 0.08, type: 'square', lp: 2500 }); noise({ t, dur: 0.3, gain: 0.3, filter: 'lowpass', freq: 1200 }); },
    // 炎上
    enjo(t) { SFX.shimatsu(t); noise({ t: t + 0.1, dur: 1.2, gain: 0.15, filter: 'bandpass', freq: 800, freq2: 3000, q: 0.5 }); },
    // メカニカルキーボードの実行音「カチャッ」
    runMech(t) {
      noise({ t, dur: 0.03, gain: 0.22, filter: 'bandpass', freq: 3800, q: 2.2 });

      tone({ t: t + 0.03, f: 2400, dur: 0.02, gain: 0.04, type: 'square', lp: 6000 });
      tone({ t: t + 0.07, f: 880, f2: 1320, glide: 0.05, dur: 0.07, gain: 0.06, type: 'triangle' });
    },
    // レジの「チーン」
    register(t) {
      for (let i = 0; i < 3; i++) noise({ t: t + i * 0.05, dur: 0.04, gain: 0.07, filter: 'bandpass', freq: 1500 + i * 300, q: 3 });
      bell(t + 0.18, 93, 0.12, 1.2); bell(t + 0.18, 100, 0.05, 0.8);
    },
    // 給料：コインがじゃらじゃら
    coins(t) { for (let i = 0; i < 8; i++) { const tt = t + i * 0.06 + Math.random() * 0.02; tone({ t: tt, f: 1900 + Math.random() * 900, dur: 0.07, gain: 0.05, type: 'square', lp: 6000 }); tone({ t: tt, f: 3800 + Math.random() * 600, dur: 0.05, gain: 0.025, type: 'triangle' }); } },
    // 缶を開ける「プシュッ」＋ごくごく
    can(t) {
      noise({ t, dur: 0.035, gain: 0.2, filter: 'bandpass', freq: 2200, q: 2 });
      noise({ t: t + 0.03, dur: 0.35, gain: 0.16, filter: 'highpass', freq: 3500, freq2: 7000, q: 0.5 });
      [0.5, 0.75, 1.0].forEach((d) => tone({ t: t + d, f: 180, f2: 120, glide: 0.1, dur: 0.12, gain: 0.12, type: 'sine' }));
    },
    // 時計が巻き戻る
    rewind(t) { for (let i = 0; i < 6; i++) tone({ t: t + i * 0.05, f: 1600 - i * 150, dur: 0.04, gain: 0.04, type: 'square', lp: 4000 }); },
    // 結果発表：ファンファーレ
    final(t) {
      const seq = [[0, 67], [0.12, 72], [0.24, 76], [0.36, 79], [0.6, 84]];
      seq.forEach(([d, m]) => pluck(t + d, m, 0.5, 0.12, sfxBus));
      [72, 76, 79, 83].forEach((m) => tone({ t: t + 0.6, f: mtof(m), dur: 1.6, hold: 0.3, gain: 0.04, type: 'triangle', attack: 0.05, lp: 2400 }));
      bell(t + 0.62, 96, 0.05, 1.6);
    },
  };

  function sfx(name) {
    if (!prefs.sfx) return;
    if (!ctx || !ensure()) return; // まだ一度も操作されていない（自動再生制限中）なら鳴らさない
    const f = SFX[name]; if (!f) return;
    try { f(ctx.currentTime + 0.01); } catch (e) { /* ignore */ }
  }

  // ------------------------------------------------------------ BGM
  // 曲は SONGS に並べる。最初から入っているのは lofi。ほかはゲーム内の購買部で買えるカセット。
  // 4小節のコード進行を8小節のメロディで回す。メロディは [16分の位置, MIDIノート, 長さ(16分)]
  const BAR = 16;
  // 夜の運用デスクの、落ち着いたローファイ（78BPM）
  const LOFI_MELODY = [
    [[0, 76, 4], [6, 72, 2], [8, 74, 2], [12, 72, 4]],
    [[2, 74, 2], [4, 71, 4], [10, 67, 2], [12, 69, 4]],
    [[0, 67, 2], [3, 71, 3], [8, 74, 4], [14, 76, 2]],
    [[0, 76, 6], [8, 72, 2], [10, 71, 2], [12, 69, 4]],
    [[8, 81, 2], [10, 79, 2], [12, 76, 4]],
    [[0, 74, 4], [6, 71, 2], [8, 74, 2], [12, 79, 4]],
    [[0, 76, 3], [4, 74, 2], [8, 71, 4], [12, 67, 4]],
    [[0, 69, 8], [12, 64, 2], [14, 67, 2]],
  ];
  const SONGS = {
    lofi: {
      bpm: 78, lead: 'pluck', drums: 'lofi', swing: 0.2,
      chords: [{ root: 41, notes: [53, 57, 60, 64] }, { root: 43, notes: [55, 59, 62, 64] }, { root: 40, notes: [52, 55, 59, 62] }, { root: 45, notes: [60, 64, 67, 71] }],
      melody: LOFI_MELODY,
      bass: [[0, 0, 6], [7, 0, 2], [10, 7, 4], [14, 12, 2]], // [位置, ルートからの半音, 長さ]
    },
    // カセット「8bit ラン」：速いチップチューン（132BPM）
    chip: {
      bpm: 132, lead: 'square', drums: 'chip', swing: 0,
      chords: [{ root: 48, notes: [60, 64, 67] }, { root: 45, notes: [57, 60, 64] }, { root: 41, notes: [53, 57, 60] }, { root: 43, notes: [55, 59, 62] }],
      melody: [
        [[0, 72, 2], [2, 76, 2], [4, 79, 2], [6, 84, 2], [8, 83, 2], [10, 79, 2], [12, 76, 4]],
        [[0, 72, 2], [2, 76, 2], [4, 81, 4], [8, 79, 2], [10, 76, 2], [12, 72, 4]],
        [[0, 77, 2], [2, 81, 2], [4, 84, 4], [8, 81, 2], [10, 77, 2], [12, 74, 4]],
        [[0, 74, 2], [2, 79, 2], [4, 83, 4], [8, 86, 4], [12, 83, 4]],
        [[0, 84, 4], [4, 83, 2], [6, 81, 2], [8, 79, 4], [12, 76, 4]],
        [[0, 76, 2], [2, 79, 2], [4, 81, 2], [6, 84, 2], [8, 88, 4], [12, 84, 4]],
        [[0, 81, 2], [2, 79, 2], [4, 77, 4], [8, 76, 2], [10, 74, 2], [12, 72, 4]],
        [[0, 74, 4], [4, 79, 4], [8, 83, 2], [10, 86, 2], [12, 91, 4]],
      ],
      bass: [[0, 0, 1], [2, 12, 1], [4, 0, 1], [6, 12, 1], [8, 0, 1], [10, 12, 1], [12, 7, 1], [14, 12, 1]],
    },
    // カセット「シティポップ・ナイト」：夜の首都高（100BPM）
    city: {
      bpm: 100, lead: 'pluck', drums: 'city', swing: 0.1,
      chords: [{ root: 38, notes: [53, 57, 60, 64] }, { root: 43, notes: [53, 59, 64, 67] }, { root: 36, notes: [55, 59, 62, 64] }, { root: 45, notes: [55, 61, 64, 67] }],
      melody: [
        [[0, 77, 2], [2, 76, 2], [4, 74, 2], [6, 72, 4], [12, 69, 2], [14, 72, 2]],
        [[0, 74, 6], [8, 71, 2], [10, 74, 2], [12, 76, 4]],
        [[0, 76, 2], [2, 79, 2], [4, 83, 4], [10, 81, 2], [12, 79, 4]],
        [[0, 76, 4], [6, 73, 2], [8, 76, 2], [10, 79, 2], [12, 81, 4]],
        [[0, 81, 2], [2, 79, 2], [4, 77, 4], [8, 76, 2], [10, 74, 2], [12, 72, 4]],
        [[2, 74, 2], [4, 77, 2], [6, 79, 4], [12, 83, 4]],
        [[0, 84, 4], [4, 83, 2], [6, 79, 2], [8, 76, 4], [12, 79, 4]],
        [[0, 81, 6], [8, 79, 2], [10, 76, 2], [12, 73, 4]],
      ],
      bass: [[0, 0, 3], [3, 12, 1], [6, 0, 2], [8, 7, 2], [11, 10, 2], [14, 12, 2]],
    },
    // カセット「雨の残業」：ドラムなし、雨の音だけ（64BPM）
    rain: {
      bpm: 64, lead: 'bell', drums: 'rain', swing: 0,
      chords: [{ root: 45, notes: [57, 60, 64, 67] }, { root: 41, notes: [53, 57, 60, 64] }, { root: 48, notes: [55, 59, 60, 64] }, { root: 43, notes: [55, 60, 62, 67] }],
      melody: [
        [[0, 76, 8], [12, 72, 4]], [[4, 77, 4], [8, 76, 4]], [[0, 79, 8], [10, 76, 2], [12, 74, 4]], [[0, 74, 12]],
        [[0, 81, 4], [4, 79, 4], [8, 76, 8]], [[2, 77, 2], [4, 76, 4], [12, 72, 4]], [[0, 71, 4], [4, 72, 4], [8, 76, 8]], [[0, 74, 8], [8, 72, 8]],
      ],
      bass: [[0, 0, 12]],
    },
  };
  let song = SONGS.lofi, STEP = 60 / song.bpm / 4;

  let timer = null, nextT = 0, stepAbs = 0;

  function pad(t, chord, len) {
    for (const m of chord.notes) {
      for (const det of [-7, 7]) {
        tone({ t, f: mtof(m), dur: 0.9, hold: len - 0.5, gain: 0.018, type: 'triangle', attack: 0.45, detune: det, lp: 1100, bus: bgmBus });
      }
    }
  }
  function playStep(s, t) {
    const S = song, bar = Math.floor(s / BAR), st = s % BAR;
    const chord = S.chords[bar % S.chords.length];
    const swing = st % 2 === 1 ? STEP * S.swing : 0;
    const tt = t + swing;
    const drums = bar >= 2; // 最初の2小節はパッドとメロディだけ
    if (st === 0) pad(t, chord, BAR * STEP);
    for (const [p, semi, len] of S.bass) {
      if (p !== st) continue;
      if (S.lead === 'square') tone({ t: tt, f: mtof(chord.root + semi), dur: len * STEP * 0.8, gain: 0.07, type: 'triangle', attack: 0.004, bus: bgmBus });
      else tone({ t: tt, f: mtof(chord.root + semi), dur: len * STEP * 0.9, gain: S.lead === 'bell' ? 0.1 : 0.16, type: 'sine', attack: 0.01, bus: bgmBus });
    }
    if (bar >= 1) {
      for (const [p, m, len] of S.melody[bar % S.melody.length]) {
        if (p !== st) continue;
        if (S.lead === 'square') tone({ t: tt, f: mtof(m), dur: len * STEP * 0.85, gain: 0.035, type: 'square', attack: 0.003, lp: 3600, bus: bgmBus });
        else if (S.lead === 'bell') { pluck(tt, m, len * STEP, 0.05, bgmBus); tone({ t: tt, f: mtof(m + 12), dur: 1.2, gain: 0.012, type: 'sine', attack: 0.01, bus: bgmBus }); }
        else pluck(tt, m, len * STEP, 0.07, bgmBus);
      }
    }
    if (S.drums === 'rain') { // 雨音
      noise({ t, dur: STEP * 1.2, gain: 0.012 + Math.random() * 0.01, filter: 'highpass', freq: 5200, q: 0.4, bus: bgmBus });
      if (Math.random() < 0.3) noise({ t: t + Math.random() * STEP, dur: 0.02, gain: 0.02, filter: 'bandpass', freq: 3000 + Math.random() * 3000, q: 4, bus: bgmBus });
      return;
    }
    if (!drums) return;
    const kick = (g) => tone({ t: tt, f: 110, f2: 42, glide: 0.11, dur: 0.24, gain: g, bus: bgmBus });
    const snare = (g) => { noise({ t: tt, dur: 0.11, gain: g, filter: 'bandpass', freq: 1700, q: 0.9, bus: bgmBus }); tone({ t: tt, f: 190, dur: 0.06, gain: g * 0.6, type: 'triangle', bus: bgmBus }); };
    const hat = (g, d) => noise({ t: tt, dur: d, gain: g, filter: 'highpass', freq: 7500, q: 0.7, bus: bgmBus });
    if (S.drums === 'chip') {
      if (st % 8 === 0) tone({ t: tt, f: 160, f2: 50, glide: 0.06, dur: 0.1, gain: 0.25, type: 'square', lp: 900, bus: bgmBus });
      if (st === 4 || st === 12) noise({ t: tt, dur: 0.08, gain: 0.08, filter: 'highpass', freq: 2500, q: 0.5, bus: bgmBus });
      if (st % 2 === 0) hat(0.018, 0.02);
      return;
    }
    if (S.drums === 'city') {
      if (st === 0 || st === 8 || st === 11) kick(0.3);
      if (st === 4 || st === 12) snare(0.08);
      hat(st % 2 ? 0.012 : 0.025, st % 4 === 2 ? 0.06 : 0.025);
      return;
    }
    if (st === 0 || st === 10 || (st === 7 && bar % 2 === 1)) kick(0.32);
    if (st === 4 || st === 12) snare(0.07);
    if (st % 2 === 0) hat(st % 4 === 2 ? 0.035 : 0.02, st % 4 === 2 ? 0.05 : 0.03);
  }
  function scheduler() {
    if (!ready()) return;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.05; // 復帰時に溜まった分は飛ばす
    while (nextT < ctx.currentTime + 0.15) {
      playStep(stepAbs, nextT);
      nextT += STEP;
      stepAbs = (stepAbs + 1) % (BAR * song.melody.length * 4) || BAR * song.melody.length; // ループ時はイントロを飛ばし、8小節の頭へ
    }
  }
  function startLoop() {
    if (timer || !prefs.bgm || !bgmWanted || !ensure() || !ready()) return;
    bgmBus.gain.cancelScheduledValues(ctx.currentTime);
    bgmBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    bgmBus.gain.linearRampToValueAtTime(BGM_LEVEL, ctx.currentTime + 1.5);
    nextT = ctx.currentTime + 0.1;
    timer = setInterval(scheduler, 25);
    scheduler();
  }
  function stopLoop() {
    if (timer) { clearInterval(timer); timer = null; }
    if (ctx) { bgmBus.gain.cancelScheduledValues(ctx.currentTime); bgmBus.gain.setTargetAtTime(0, ctx.currentTime, 0.08); }
    stepAbs = 0;
  }

  // ------------------------------------------------------------ 公開API
  function playBgm() { bgmWanted = true; startLoop(); }
  function setBgm(on) { prefs.bgm = !!on; savePrefs(); if (on) { bgmWanted = true; ensure(); startLoop(); } else stopLoop(); notify(); }
  // 曲を替える（カセットの入れ替え）。鳴っていれば頭から流し直す
  function setSong(name) {
    const next = SONGS[name] || SONGS.lofi;
    if (next === song) return;
    const playing = !!timer;
    if (playing) stopLoop();
    song = next; STEP = 60 / song.bpm / 4;
    if (playing) startLoop();
  }
  function setSfx(on) { prefs.sfx = !!on; savePrefs(); notify(); }
  function onChange(fn) { listeners.push(fn); }
  function notify() { listeners.forEach((fn) => { try { fn(Object.assign({}, prefs)); } catch (e) { /* ignore */ } }); }

  // 最初の操作で音を出せるようにする
  function unlock() {
    if (!ensure()) return;
    const go = () => startLoop();
    if (ready()) go(); else ctx.resume().then(go, () => {});
  }
  ['pointerdown', 'keydown', 'touchend'].forEach((ev) => document.addEventListener(ev, unlock, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend().catch(() => {});
    else ctx.resume().then(() => startLoop(), () => {});
  });

  root.Sound = { sfx, playBgm, setBgm, setSfx, setSong, onChange, get prefs() { return Object.assign({}, prefs); } };
})(window);

</script>

  const reduced = () => root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ------------------------------------------------------------ タイトル背景：夕暮れの街（ドット絵）
  function skyline() {
    const W = 320, H = 180;
    let seed = 4242;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    let s = '', defs = '';
    const rect = (x, y, w, h, c, extra) => { s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"${extra || ''}/>`; };
    // 空：色の帯と、帯のつなぎ目の市松ディザ
    const sky = ['#2a2560', '#3a2d74', '#523a88', '#714795', '#965596', '#bd6690', '#e27d84', '#f59c78', '#fbbd7a'];
    const bh = 13;
    sky.forEach((c, i) => {
      rect(0, i * bh, W, bh, c);
      if (i < sky.length - 1) {
        defs += `<pattern id="d${i}" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="${sky[i + 1]}"/><rect x="1" y="1" width="1" height="1" fill="${sky[i + 1]}"/></pattern>`;
        rect(0, (i + 1) * bh - 3, W, 3, `url(#d${i})`);
      }
    });
    rect(0, sky.length * bh, W, H - sky.length * bh, sky[sky.length - 1]);
    // 星
    for (let i = 0; i < 46; i++) {
      const tw = rnd() < 0.35 ? ` class="tw" style="animation-delay:${(rnd() * 3).toFixed(1)}s"` : '';
      rect(ri(0, W - 1), ri(2, 52), 1, 1, rnd() < 0.3 ? '#fee761' : '#fbf7ea', tw);
    }
    // 月
    const mx = 258, my = 26, mr = 9;
    for (let dy = -mr; dy <= mr; dy++) { const hw = Math.floor(Math.sqrt(mr * mr - dy * dy)); rect(mx - hw, my + dy, hw * 2 + 1, 1, '#fff1c1'); }
    rect(mx - 3, my - 2, 2, 2, '#f1dca0'); rect(mx + 2, my + 3, 3, 2, '#f1dca0'); rect(mx + 4, my - 5, 1, 1, '#f1dca0');
    // 雲
    [[30, 40, 34], [196, 58, 44], [96, 70, 30]].forEach(([x, y, w]) => { rect(x, y, w, 2, '#f7b2a0'); rect(x + 4, y - 2, w - 10, 2, '#f7b2a0'); rect(x + 2, y + 2, w - 2, 1, '#d98a94'); });
    // ビル（奥 → 手前）。窓の明かりはランダム、一部はまたたく
    const layer = (color, hMin, hMax, wMin, wMax, lit, winColor) => {
      let x = -ri(0, 10);
      while (x < W) {
        const w = ri(wMin, wMax), h = ri(hMin, hMax), top = H - h;
        rect(x, top, w, h, color);
        if (rnd() < 0.3) rect(x + Math.floor(w / 2), top - ri(3, 8), 1, 8, color); // アンテナ
        if (lit) {
          for (let wy = top + 4; wy < H - 8; wy += 5) for (let wx = x + 3; wx < x + w - 3; wx += 4) {
            if (rnd() < lit) {
              const tw = rnd() < 0.06 ? ` class="tw" style="animation-delay:${(rnd() * 4).toFixed(1)}s"` : '';
              rect(wx, wy, 2, 2, rnd() < 0.8 ? winColor : '#fbf7ea', tw);
            }
          }
        }
        x += w + ri(0, 3);
      }
    };
    layer('#7a4f8a', 46, 88, 14, 28, 0, null);

  const ANSWER_STEP = (say) => ({ task: '結論を選び、根拠を入れて回答する', say, coach: '#answer-form', done: () => false });
  const LESSONS = {

  };
  const lessonCache = {};

  // ---------------------------------------------------------------- state
  let DB = null, KEYS = {}, COUNTS = {};
  let state = null; // 100件そろってから作る
  // CASES の並び：[0, WORK) が本番の100件、[WORK, CASES.length) が研修の3件
  let WORK = 0;
  const trainIdx = () => CASES.map((_, i) => i).filter((i) => i >= WORK);
  const isTrain = (i) => i >= WORK;
  const inTraining = () => !!state && state.phase === 'training';
  const workSt = () => state.cases.slice(0, WORK);
  const workBegun = () => workSt().some((c) => c.seen);
  const freshCase = () => ({ status: 'open', wrong: 0, hints: 0, score: 0, bonus: 0, queries: 0, heavy: false, choice: null, evidence: '', seen: false, via: null, specUsed: false, enjo: false, honest: false, banned: false, step: 0 });
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    return {
      started: false, phase: 'work', trainDone: false, workCurrent: null, current: order[0], shimatsu: 0, order, day: 1, dayLog: {}, specDay: 0, combo: 0, maxCombo: 0, minutes: 0,
      shimatsuIssued: 0, thrown: 0, penalty: 0, enjo: 0, heavyCount: 0, dropUsed: false,
      // 給料と購買部

      tape: 'lofi', bezelOn: true, snippets: [], shimatsuAtStart: 0, enjoAtStart: 0, trainPaid: false, shopVisits: 0, shopSeenDay: 0,

  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }
  function loadLocal() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; } }
  function validState(s) { return s && Array.isArray(s.cases) && (s.cases.length === CASES.length || s.cases.length === WORK) && typeof s.current === 'number'; }
  function validOrder(o) { return Array.isArray(o) && o.length === WORK && o.slice().sort((a, b) => a - b).every((v, i) => v === i); }

  const totalScore = () => Math.max(0, state.cases.reduce((a, c) => a + c.score + (c.bonus || 0), 0) - state.shimatsu * SHIMATSU - (state.penalty || 0));
  const DAYS = () => Math.ceil(WORK / DAY_SIZE);
  const dayCases = (d) => state.order.slice((d - 1) * DAY_SIZE, d * DAY_SIZE);
  const dayOf = (i) => Math.floor(state.order.indexOf(i) / DAY_SIZE) + 1;
  const dayScore = (d) => dayCases(d).reduce((a, i) => a + state.cases[i].score + (state.cases[i].bonus || 0), 0);
  const dayDone = () => dayCases(state.day).every((i) => state.cases[i].status !== 'open');
  const allDone = () => state.day >= DAYS() && dayDone();
  const posOf = (i) => state.order.indexOf(i) % DAY_SIZE; // その日の何件目か
  const shownCases = () => (inTraining() ? trainIdx() : dayCases(state.day)); // 上のバーに並ぶチケット
  const firstOpen = () => { const ds = shownCases(); const i = ds.find((k) => state.cases[k].status === 'open'); return i == null ? ds[ds.length - 1] : i; };
  const angerOf = (i) => (state.cases[i].status === 'solved' ? 0 : Math.min(5, (CASES[i].temper || 3) + state.cases[i].wrong + (state.cases[i].enjo ? 2 : 0)));
  function clockText(extra) {

  // ---------------------------------------------------------------- time helpers
  function shiftDt(dt, minutes) {
    if (dt == null) return null;

    if (!m) return null;

  }

    if (!m) return null;
    return (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]);

  // ---------------------------------------------------------------- DB boot

  async function loadSql() {

  // ---------------------------------------------------------------- SQL runner
  function splitStatements(src) {
    const out = []; let cur = ''; let i = 0; const n = src.length;
    while (i < n) {
      const ch = src[i], nx = src[i + 1];
      if (ch === '-' && nx === '-') { const j = src.indexOf('\n', i); const end = j < 0 ? n : j; cur += src.slice(i, end); i = end; continue; }
      if (ch === '/' && nx === '*') { const j = src.indexOf('*/', i + 2); const end = j < 0 ? n : j + 2; cur += src.slice(i, end); i = end; continue; }
      if (ch === "'" || ch === '"' || ch === '`') {
        let j = i + 1;
        while (j < n) { if (src[j] === ch) { if (src[j + 1] === ch) { j += 2; continue; } break; } j++; }
        cur += src.slice(i, j + 1); i = j + 1; continue;
      }
      if (ch === ';') { out.push(cur); cur = ''; i++; continue; }
      cur += ch; i++;

    out.push(cur);
    return out.map((s) => s.trim()).filter((s) => stripComments(s).trim());

  const stripComments = (s) => s.replace(/--[^\n]*/g, ' ').replace(/\/\*[\s\S]*?(\*\/|$)/g, ' ');
  const firstWord = (s) => { const m = stripComments(s).replace(/^[\s(]+/, '').match(/^[A-Za-z]+/); return m ? m[0].toUpperCase() : ''; };

  const SHIMATSU_MSG = {

  // ---------------------------------------------------------------- ゲームだからいいよね（禁断の操作）

  function forbiddenDrop(stmt) {

  function backdoorFix() {

    state.combo = 0;

    $('#results').innerHTML = `<div class="rblock"><div class="rmeta"><span class="rsql">-- 本番DB（直結）</span></div><div class="backdoor-ok">Query OK, 1 row affected<small>ジェム 1,800個を、ユーザーに直接付与しました。</small></div></div>`;

    if (f) {

      f.floatText($('#score'), `+${BACKDOOR_SCORE}`, 'plus');
      say('senpai', '……やりやがった。今回だけは見なかったことにする。現実でやったら監査で一発アウトだからな。', { interrupt: true });

  }
  // わざと重いクエリ：数億行になる掛け合わせは、実行する前にHさんが止める
  const BIG_TABLES = /\b(log_[a-z_]+|usr_[a-z_]+)\b/gi; // ログとユーザーデータは行数が多い
  function isQueryBomb(stmt) {
    const s = stripComments(stmt);
    const from = s.split(/\bFROM\b/i).slice(1).join(' FROM ');
    if (!from) return false;

  function execStatements(stmts) {

      const s = stmts[k];

      let st;
      try {
        st = DB.prepare(s);

        const rows = [];
        let count = 0, cut = false;
        while (st.step()) { if (count < 1000) rows.push(st.get()); count++; if (count >= BIG_ROWS) { cut = true; break; } }
        const ms = performance.now() - t0;

  function paySalary(d) {
    if (!window.Shop) return null;
    if (state.pay[d]) return state.pay[d];
    const ids = dayCases(d), score = dayScore(d), [, grade] = gradeOf(score);
    const sh = Math.max(0, state.shimatsu - (state.shimatsuAtStart || 0));
    const en = Math.max(0, (state.enjo || 0) - (state.enjoAtStart || 0));
    const lines = [
      ['基本給（本日の得点）', score],
      ['定時退社手当', DAY_START + state.minutes <= DAY_END ? PAY.ontime : 0],
      ['皆勤賞（5件すべて解決）', ids.every((i) => state.cases[i].status === 'solved') ? PAY.allSolved : 0],
      [`評価手当（${grade}）`, PAY.grade[grade]],
      [`減給（始末書 ${sh}枚）`, sh * PAY.shimatsu],
      [`減給（炎上 ${en}回）`, en * PAY.enjo],
    ].filter(([k, v], n) => n === 0 || v !== 0);
    const total = Math.max(0, lines.reduce((a, [, v]) => a + v, 0));
    state.pay[d] = { lines, total };
    state.wallet += total; state.earned += total;
    save(); renderHud();
    setTimeout(() => snd('coins'), 900);
    return state.pay[d];

  // ---------------------------------------------------------------- 購買部

    const list = SHOP().ITEMS.filter((it) => it.from <= state.day && (it.kind === 'consumable' || !owns(it.id)));
    return list.length ? list[(state.day * 7 + 3) % list.length] : null;

  function buy(id) {

  // CS管理画面の権限（道具）：公開ID → user_id
  const uidCache = {};
  function uidOf(pub) {
    if (!DB || !pub) return null;

    let v = null;
    try { const st = DB.prepare('SELECT user_id FROM usr_users WHERE public_id = ?'); st.bind([pub]); if (st.step()) v = st.get()[0]; st.free(); } catch (e) { /* ignore */ }

  // 行動タイムライン（道具）：そのユーザーの log_ テーブルをまとめて時系列に
  function timelineSql(c) {
    const u = uidExpr(c);
    const parts = [
      ['log_login', 'log_id', 'result', "country || ' ' || ip_address"],
      ['log_character', 'log_id', 'action', 'detail'],
      ['log_item', 'log_id', 'action', "(SELECT name FROM mst_items m WHERE m.item_id = l.item_id) || ' x' || quantity"],

    ].map(([t, id, what, detail], k) => `  ${k ? 'UNION ALL ' : ''}SELECT '${t}' AS tbl, ${id} AS id, created_at, ${what} AS what, ${detail} AS detail FROM ${t} l WHERE user_id = ${u}`);

  }

    ['マスターと JOIN して名前を付ける', 'JOIN ... ON', (c) => `SELECT l.log_id, l.created_at, l.action, m.name, l.quantity\nFROM log_item l\nJOIN mst_items m ON m.item_id = l.item_id\nWHERE l.user_id = ${uidExpr(c)}\nORDER BY l.created_at DESC;`],

  // ---------------------------------------------------------------- events
  // ---------------------------------------------------------------- デバッグモード（動作確認用）
  // SQLエディタで「:debug」と書いて実行（Ctrl+Enter）すると、画面左下にデバッグパネルが出る。もう一度実行すると消える。
  // URL に ?debug を付けて開いても入る。オン／オフはセーブデータとは別に localStorage に残る。
  const DEBUG_KEY = 'logs-dont-lie:debug';
  let debugOn = false, debugForce = false, debugOpen = true;
  try { debugOn = localStorage.getItem(DEBUG_KEY) === '1' || /[?&]debug\b/.test(location.search); } catch (e) { /* storage unavailable */ }
  function debugCommand(src) {
    const m = stripComments(src).trim().match(/^[:\\]debug(?:\s+(on|off))?\s*;?$/i);
    if (!m) return false;
    setDebug(m[1] ? m[1].toLowerCase() === 'on' : !debugOn);
    return true;
  }
  function setDebug(on) {
    debugOn = on;
    try { if (on) localStorage.setItem(DEBUG_KEY, '1'); else localStorage.removeItem(DEBUG_KEY); } catch (e) { /* storage unavailable */ }
    snd('pop');
    toast(on ? 'DEBUG MODE ON' : 'DEBUG MODE OFF', on ? '左下のパネルから所持金や進行を操作できます。:debug をもう一度実行すると終了。' : 'デバッグパネルを閉じました。');
    renderDebug();
  }
  // いまのチケットの正解の根拠（分かるものだけ）
  const evidenceOf = (c) => { const e = c.evidence || {}; const v = e.value != null ? e.value : e.id != null ? e.id : e.key ? KEYS[e.key] : null; return v == null ? '' : String(v); };
  function renderDebug() {

    const ans = (c.options.find((o) => o[0] === c.answer) || [])[1] || '';
    const btn = (act, label, dis) => `<button type="button" data-dbg="${act}" ${dis ? 'disabled' : ''}>${label}</button>`;
    el.hidden = false;
    el.innerHTML = `<div class="debug-head"><b>DEBUG</b><span>DAY ${state.day}${inTraining() ? '（研修）' : ''}・${esc(slotLabel(i))}・${clockText()}</span>
        <button type="button" data-dbg="fold" aria-label="${debugOpen ? 'たたむ' : 'ひらく'}">${debugOpen ? '−' : '+'}</button><button type="button" data-dbg="off" aria-label="デバッグモードを終了">×</button></div>
      ${debugOpen ? `<div class="debug-body">
        <p class="debug-label">所持金 ${yen(state.wallet)}</p>
        <div class="debug-row">${btn('money:1000', '+1,000')}${btn('money:10000', '+10,000')}${btn('money:0', '0 にする')}</div>
        <p class="debug-label">チケット ${esc(c.label)}（${open ? '未解決' : st.status === 'solved' ? '解決済み' : '先輩に聞いた'}）</p>
        <div class="debug-row">${btn('solve', '強制成功', !open)}${btn('reject', '強制差し戻し', !open)}${btn('reopen', '未解決に戻す', open)}</div>
        <p class="debug-answer">正解：${esc(ans)}<br>根拠：<code>${esc(evidenceOf(c) || '（受け付け条件のみ）')}</code></p>
        <div class="debug-row">${btn('fill', '正解を入力欄に入れる', !open)}${btn('model', '模範SQLを実行')}</div>

        <div class="debug-row">${btn('solve-day', '今日の残りを全部解決', inTraining())}${btn('end-day', '今日を締める', inTraining())}</div>
        <div class="debug-row"><label>DAY <input type="number" id="dbg-day" min="1" max="${DAYS()}" value="${Math.min(DAYS(), state.day + 1)}"></label>${btn('jump', 'へジャンプ（前の日は全部解決）')}</div>
        <p class="debug-label">購買部</p>
        <div class="debug-row">${btn('own-all', '全道具を持つ')}${btn('own-none', '道具・飾りを手放す')}${btn('fill-inv', '消耗品を満タン')}${btn('new-stock', '入荷通知をリセット')}</div>
        <p class="debug-label">時計・ペナルティ</p>
        <div class="debug-row">${btn('clock:0', '10:00 に戻す')}${btn('clock:+120', '+2時間')}${btn('clock:end', '18:30 にする')}</div>
        <div class="debug-row">${btn('shimatsu:+1', '始末書 +1')}${btn('shimatsu:0', '始末書 0')}${btn('combo:+1', 'コンボ +1')}</div>
      </div>` : ''}`;
  }
  // 前の日を飛ばすとき・今日をまとめて片付けるときの「解決扱い」
  const debugSolve = (k) => { const s = state.cases[k]; if (s.status === 'open') Object.assign(s, { status: 'solved', score: BASE, bonus: 0, seen: true }); };
  function debugAction(act) {
    const [cmd, arg] = act.split(':');
    const i = state.current, c = CASES[i], st = state.cases[i];
    const refresh = () => { save(); renderAll(); renderDebug(); };
    if (cmd === 'off') { setDebug(false); return; }
    if (cmd === 'fold') { debugOpen = !debugOpen; renderDebug(); return; }
    if (cmd === 'money') { if (arg === '0') state.wallet = 0; else { state.wallet += +arg; state.earned += +arg; } snd('coins'); refresh(); return; }
    if (cmd === 'fill' || cmd === 'solve') {
      if (st.status !== 'open') return;
      const r = document.querySelector(`#answer-form input[name="choice"][value="${c.answer}"]`); if (r) r.checked = true;
      const ev = evidenceOf(c); if ($('#evidence')) $('#evidence').value = ev || 'DEBUG';
      if (cmd === 'solve') { debugForce = true; $('#answer-form').requestSubmit(); }
      renderDebug(); return;
    }
    if (cmd === 'reject') {
      if (st.status !== 'open') return;
      const r = document.querySelector(`#answer-form input[name="choice"]:not([value="${c.answer}"])`); if (r) r.checked = true;
      $('#evidence').value = '0'; $('#answer-form').requestSubmit(); renderDebug(); return;
    }
    if (cmd === 'reopen') { Object.assign(st, { status: 'open', score: 0, bonus: 0, via: null, wrong: 0, hints: 0 }); refresh(); return; }
    if (cmd === 'model') { setEditor(c.model, false); runSql(); return; }
    if (cmd === 'solve-day') { dayCases(state.day).forEach(debugSolve); refresh(); return; }
    if (cmd === 'end-day') { dayCases(state.day).forEach(debugSolve); refresh(); if (allDone()) showFinal(true); else showDayEnd(true); return; }
    if (cmd === 'jump') {
      const d = Math.max(1, Math.min(DAYS(), parseInt($('#dbg-day').value, 10) || 1));
      if (inTraining()) state.phase = 'work';
      for (let k = 1; k < d; k++) dayCases(k).forEach(debugSolve);
      state.drafts[state.current] = $('#sql').value;
      state.day = d; state.minutes = 0; state.current = firstOpen();
      state.shimatsuAtStart = state.shimatsu; state.enjoAtStart = state.enjo || 0;
      $('#results').dataset.used = ''; refresh(); closeModal(); startDay(); return;
    }
    if (cmd === 'own-all') { SHOP().ITEMS.filter((it) => it.kind === 'tool').forEach((it) => { state.owned[it.id] = true; }); completeWords = null; }
    else if (cmd === 'own-none') { state.owned = {}; state.tape = 'lofi'; completeWords = null; }
    else if (cmd === 'fill-inv') SHOP().ITEMS.filter((it) => it.kind === 'consumable').forEach((it) => { state.inv[it.id] = it.max || 3; });
    else if (cmd === 'new-stock') state.shopSeenDay = 0;
    else if (cmd === 'clock') state.minutes = arg === 'end' ? DAY_END + 30 - DAY_START : arg.startsWith('+') ? state.minutes + +arg.slice(1) : +arg;
    else if (cmd === 'shimatsu') state.shimatsu = arg === '0' ? 0 : state.shimatsu + 1;
    else if (cmd === 'combo') { state.combo = (state.combo || 0) + 1; state.maxCombo = Math.max(state.maxCombo || 0, state.combo); }
    snd('pop'); refresh();
  }

    document.addEventListener('keydown', (e) => {
      const t = e.target.closest && e.target.closest('.rtab'); if (!t || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      const all = [...t.parentNode.children], n = all[(all.indexOf(t) + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length];
      e.preventDefault(); n.focus(); showResultTab(n);
    });
    document.addEventListener('input', (e) => {
      if (!e.target.classList || !e.target.classList.contains('rfilter')) return;
      const q = e.target.value.trim().toLowerCase(), tb = e.target.closest('.rblock').querySelector('tbody');
      tb.querySelectorAll('tr').forEach((tr) => { tr.hidden = !!q && !tr.textContent.toLowerCase().includes(q); });
    });
    document.addEventListener('dblclick', (e) => {
      const td = e.target.closest('.grid td'); if (!td || td.classList.contains('rn') || e.target.closest('.drill')) return;
      const inp = $('#evidence'); if (!inp) return;
      inp.value = td.textContent; state.cases[state.current].evidence = inp.value; save();
      document.querySelectorAll('.grid td.picked').forEach((x) => x.classList.remove('picked'));
      td.classList.add('picked');
      snd('pop');
      toast('根拠欄に入力しました', td.textContent);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#overlay').hidden && state && state.started) closeModal(); });
  }

  function sortResult(th, col) {
    const table = th.closest('table'), tb = table.querySelector('tbody');
    const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
    table.querySelectorAll('th[data-sort]').forEach((x) => { delete x.dataset.dir; });
    th.dataset.dir = dir;
    const val = (tr) => { const td = tr.children[col]; const t = td ? td.textContent : ''; const n = Number(t); return td && td.classList.contains('num') && Number.isFinite(n) ? n : t; };
    const rows = [...tb.querySelectorAll('tr')].sort((a, b) => { const x = val(a), y = val(b); const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'ja'); return dir === 'asc' ? c : -c; });
    rows.forEach((r) => tb.appendChild(r));
    snd('pop');
  }

  // ---------------------------------------------------------------- sound toggles
  function bindSound() {
    const S = window.Sound;
    const bgm = $('#btn-bgm'), se = $('#btn-sfx');
    if (!S) { bgm.hidden = true; se.hidden = true; return; }
    const sync = (p) => { bgm.setAttribute('aria-pressed', String(p.bgm)); se.setAttribute('aria-pressed', String(p.sfx)); };
    sync(S.prefs); S.onChange(sync);
  }

  // ---------------------------------------------------------------- boot
  // 100件そろってから、保存データを読む（7件だった頃の保存データは合わないので最初から）
  function loadState(data) {
    const saved = validState(data) ? data : loadLocal();
    state = freshState();
    if (validState(saved) && validOrder(saved.order)) {
      const fresh = freshState();
      state = Object.assign(fresh, saved);
      // 研修の3件が増える前の保存データは、研修の分を空で足す
      state.cases = CASES.map((_, i) => Object.assign(freshCase(), (saved.cases || [])[i] || {}));
      if (state.phase !== 'training' || CASES.length === WORK) state.phase = 'work';
      if (!(state.current >= 0 && state.current < CASES.length) || isTrain(state.current) !== inTraining()) state.current = firstOpen();
      if (!state.day) state.day = 1;
      if (!state.dayLog) state.dayLog = {};
      delete state.history; // 実行履歴の機能は削除済み
      delete state.unplugged; // 電話線（TEL）の機能は削除済み
      // 命名規則の変更前に保存された下書きのテーブル名を、新しい名前に置き換える
      const RENAMED = [['character_logs', 'log_character'], ['item_logs', 'log_item'], ['login_logs', 'log_login'], ['currency_logs', 'log_currency'],
        ['payment_logs', 'log_payment'], ['error_logs', 'log_error'], ['m_items', 'mst_items'], ['m_products', 'mst_products'],
        ['worlds', 'mst_worlds'], ['characters', 'usr_characters'], ['users', 'usr_users']];
      Object.keys(state.drafts || {}).forEach((k) => {
        let s = String(state.drafts[k] || '');
        RENAMED.forEach(([from, to]) => { s = s.replace(new RegExp(`(?<![A-Za-z0-9_])${from}(?![A-Za-z0-9_])`, 'g'), to); });
        state.drafts[k] = s;
      });
    }
  }
  function start(data) {
    bind();
    bindSound();
    if (FXo()) document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = FXo().icon(el.dataset.icon, +el.dataset.scale || 3); });
    showIntro(); // DBの準備中は「出社する」を押せない
    initDb().then((ok) => {
      if (!ok) return;
      loadState(data);
      renderAll();
      if (allDone() && state.started) { showFinal(false); if (window.Sound) window.Sound.playBgm(); } else showIntro();
    });
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(() => state); } catch (e) { /* ignore */ } }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
